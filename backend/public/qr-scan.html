<!doctype html>
<html>
  <head>
    <title>QR Attendance Scan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
      }
      h2 {
        color: #0b5ed7;
      }
      #status {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h2>Chartered Mentor Attendance</h2>
    <p id="status">Processing QR scan...</p>

    <script>
      let studentId = localStorage.getItem("studentId");
      let token = null;

      const cmUserStr = localStorage.getItem("cmUser");
      if (cmUserStr) {
        try {
          const cmUser = JSON.parse(cmUserStr);
          if (cmUser) {
            studentId = cmUser.userId || cmUser.studentId || studentId;
            token = cmUser.token;
          }
        } catch (e) {
          console.error("Failed to parse cmUser from localStorage", e);
        }
      }

      if (!studentId) {
        document.getElementById("status").innerText =
          "Please login first on this device";
        throw new Error("Student not logged in");
      }

      const params = new URLSearchParams(window.location.search);
      const qrValue = params.get("qr");

      if (!qrValue) {
        document.getElementById("status").innerText = "Invalid QR code";
        throw new Error("QR missing");
      }

      if (!navigator.geolocation) {
        document.getElementById("status").innerText = "Geolocation is not supported by your browser";
        throw new Error("Geolocation not supported");
      }

      let deviceId = localStorage.getItem("device_id");
      if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("device_id", deviceId);
      }

      const optionsHigh = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      };

      const optionsLow = {
        enableHighAccuracy: false,
        timeout: 15000,
        maximumAge: 60000
      };

      const sendAttendance = (lat, lng) => {
        const headers = {
          "Content-Type": "application/json",
        };
        if (token) {
          headers["Authorization"] = `Bearer ${token}`;
        }

        fetch("/student/scan-qr", {
          method: "POST",
          headers: headers,
          body: JSON.stringify({
            studentId,
            qrValue,
            deviceId,
            lat: lat,
            lng: lng
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("status").innerText = data.message;
          })
          .catch(() => {
            document.getElementById("status").innerText =
              "Server error while marking attendance";
          });
      };

      const handleGeoError = (error) => {
        if (error.code === error.PERMISSION_DENIED) {
          document.getElementById("status").innerText = "Location access denied. Please enable location permissions in your browser/device settings to mark attendance.";
        } else if (error.code === error.TIMEOUT) {
          document.getElementById("status").innerText = "Location request timed out. Please ensure GPS/location is enabled and try again.";
        } else {
          document.getElementById("status").innerText = "Unable to retrieve location. Please check your device location settings and try again.";
        }
      };

      // Try high accuracy first
      navigator.geolocation.getCurrentPosition(
        (position) => {
          sendAttendance(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
          console.warn("High accuracy geolocation failed, trying low accuracy...", error);
          if (error.code === error.TIMEOUT || error.code === error.POSITION_UNAVAILABLE) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                sendAttendance(position.coords.latitude, position.coords.longitude);
              },
              (err2) => {
                handleGeoError(err2);
              },
              optionsLow
            );
          } else {
            handleGeoError(error);
          }
        },
        optionsHigh
      );
    </script>
  </body>
</html>
